<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLAS Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "preact":       "https://esm.sh/preact@10.23.1",
      "preact/hooks": "https://esm.sh/preact@10.23.1/hooks",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
    }
  }
  </script>

  <style>
    /* ── design tokens ──────────────────────────────────────────────── */
    :root {
      --bg:       #0a0d12;
      --bg2:      #0f1318;
      --card:     #141920;
      --card2:    #1a2130;
      --border:   #1e2a38;
      --cyan:     #3ad6e0;
      --cyan-dim: #1f8a90;
      --amber:    #f5a623;
      --amber-bg: #2a1f0a;
      --red:      #e05555;
      --green:    #3de08a;
      --green-bg: #0a1f14;
      --navy:     #0d1a2e;
      --text:     #e2e8f0;
      --text-2:   #8899aa;
      --text-3:   #4a5568;
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      --radius:   8px;
      --radius-lg: 12px;
    }

    /* ── reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ── scrollbar ──────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── layout ─────────────────────────────────────────────────────── */
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── topbar ─────────────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-brand {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }
    .topbar-brand span { color: var(--text-2); font-weight: 600; font-size: 13px; margin-left: 10px; letter-spacing: 0.04em; }
    .topbar-nav { display: flex; gap: 6px; }
    .nav-btn {
      padding: 5px 14px;
      border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      transition: color .15s, background .15s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--card2);
      color: var(--text);
    }

    /* ── main content ───────────────────────────────────────────────── */
    .main { flex: 1; padding: 32px 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── page title ─────────────────────────────────────────────────── */
    .page-title {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700;
      margin-bottom: 6px;
    }
    .page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

    /* ── band chips ─────────────────────────────────────────────────── */
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 9px; border-radius: 4px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
      font-family: var(--font-mono);
    }
    .chip-crit  { background: rgba(240,100,80,.18); color: #f06450; border: 1px solid rgba(240,100,80,.35); }
    .chip-focus { background: rgba(245,166,35,.14); color: var(--amber); border: 1px solid rgba(245,166,35,.3); }
    .chip-hold  { background: rgba(58,214,224,.1);  color: var(--cyan-dim); border: 1px solid rgba(58,214,224,.2); }

    /* ── topic rows (home) ───────────────────────────────────────────── */
    .topic-grid { display: flex; flex-direction: column; gap: 10px; }

    .topic-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color .15s;
    }
    .topic-row:hover { border-color: var(--cyan-dim); }
    .topic-row.crit { border-left: 3px solid #f06450; }
    .topic-row.focus { border-left: 3px solid var(--amber); }
    .topic-row.hold { border-left: 3px solid var(--cyan-dim); }

    .topic-header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }

    .topic-name {
      font-weight: 600; font-size: 15px;
      display: flex; align-items: center; gap: 10px;
    }

    .mastery-bar-wrap {
      display: flex; align-items: center; gap: 10px;
      min-width: 160px;
    }
    .mastery-bar {
      flex: 1; height: 6px;
      background: var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .mastery-fill {
      height: 100%; border-radius: 3px;
      background: var(--cyan);
      transition: width .4s ease;
    }
    .mastery-fill.low { background: #f06450; }
    .mastery-fill.mid { background: var(--amber); }
    .mastery-val {
      font-family: var(--font-mono);
      font-size: 12px; color: var(--text-2);
      min-width: 32px; text-align: right;
    }

    .focus-score {
      font-family: var(--font-mono);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      min-width: 60px; text-align: right;
    }
    .focus-score.high { color: var(--amber); }

    .expand-icon {
      color: var(--text-3); font-size: 12px;
      transition: transform .2s;
    }
    .topic-row.open .expand-icon { transform: rotate(180deg); }

    /* ── readings panel ─────────────────────────────────────────────── */
    .readings-panel {
      border-top: 1px solid var(--border);
      padding: 12px 20px 16px;
      display: none;
    }
    .topic-row.open .readings-panel { display: block; }

    .readings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .reading-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .reading-card:hover {
      border-color: var(--cyan-dim);
      background: #1d2840;
    }
    .reading-title {
      font-size: 13px; font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .reading-meta {
      font-size: 11px; color: var(--text-2);
      font-family: var(--font-mono);
      display: flex; gap: 10px;
    }

    /* ── reading view ───────────────────────────────────────────────── */
    .reading-layout {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .reading-layout { grid-template-columns: 1fr; }
      .los-rail { order: -1; }
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-2);
      margin-bottom: 20px;
      padding: 5px 10px;
      border-radius: var(--radius);
      transition: color .15s, background .15s;
    }
    .back-btn:hover { color: var(--text); background: var(--card); }

    .doc-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      margin-bottom: 6px;
    }
    .doc-meta {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--text-2);
      margin-bottom: 28px;
    }

    /* ── chunk cards ────────────────────────────────────────────────── */
    .chunk-list { display: flex; flex-direction: column; gap: 12px; }

    .chunk-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }

    .chunk-card.formula {
      background: var(--navy);
      border-color: rgba(58,214,224,.35);
      border-left: 3px solid var(--cyan);
    }

    .chunk-card.example {
      background: var(--green-bg);
      border-color: rgba(61,224,138,.25);
      border-left: 3px solid var(--green);
    }

    .chunk-heading {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .chunk-type-tag {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 3px;
      letter-spacing: 0.06em;
    }
    .chunk-card.formula .chunk-type-tag {
      background: rgba(58,214,224,.15); color: var(--cyan);
    }
    .chunk-card.example .chunk-type-tag {
      background: rgba(61,224,138,.15); color: var(--green);
    }

    .section-divider {
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      padding: 8px 0 4px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .chunk-body {
      font-size: 13.5px; line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chunk-card.formula .chunk-body {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #c9e8ec;
    }

    /* example toggle */
    .example-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--green);
      font-weight: 600; margin-top: 10px;
      padding: 0; background: none; border: none;
      cursor: pointer; font-family: var(--font-body);
    }

    /* ── LOS rail ───────────────────────────────────────────────────── */
    .los-rail {
      position: sticky; top: 72px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .los-rail-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
    }
    .los-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px; line-height: 1.5;
    }
    .los-item:last-child { border-bottom: none; }
    .los-num {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--cyan); font-weight: 600;
      min-width: 24px; margin-top: 1px;
    }
    .los-text { color: var(--text-2); }
    .los-verb {
      display: inline-block; margin-top: 2px;
      font-size: 10px; font-weight: 700;
      background: rgba(58,214,224,.1); color: var(--cyan-dim);
      padding: 0 5px; border-radius: 3px;
      font-family: var(--font-mono);
    }

    /* ── loading / error states ─────────────────────────────────────── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: var(--text-3); font-size: 14px;
    }
    .loader-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--cyan); margin: 0 3px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: .2s; }
    .loader-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,80%,100% { opacity: .2; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .error-box {
      background: rgba(224,85,85,.1); border: 1px solid rgba(224,85,85,.3);
      border-radius: var(--radius); padding: 16px; color: var(--red);
      font-size: 13px;
    }

    /* ── filter bar (formulas + drill) ──────────────────────────────────── */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: 12px; font-weight: 500;
      color: var(--text-2);
      border: 1px solid var(--border);
      transition: color .15s, background .15s, border-color .15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--cyan-dim); }
    .filter-btn.active { background: var(--card2); color: var(--cyan); border-color: var(--cyan-dim); }

    /* ── formula sheet ──────────────────────────────────────────────────── */
    .formula-group { margin-bottom: 32px; }
    .formula-group-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .formula-group-name {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
    }
    .formula-card {
      background: var(--navy);
      border: 1px solid rgba(58,214,224,.25);
      border-left: 3px solid var(--cyan);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
    }
    .formula-card-heading {
      font-size: 12px; font-weight: 700;
      color: var(--cyan); letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .formula-card-body {
      font-family: var(--font-mono);
      font-size: 13px; line-height: 1.7;
      color: #c9e8ec; white-space: pre-wrap; word-break: break-word;
    }
    .formula-card-meta {
      font-size: 11px; color: var(--text-3);
      font-family: var(--font-mono);
      margin-top: 8px;
    }
    .empty-state {
      text-align: center; color: var(--text-3);
      font-size: 14px; padding: 60px 0;
    }

    /* ── example drill ──────────────────────────────────────────────────── */
    .drill-progress {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .drill-progress-bar {
      flex: 1; height: 4px;
      background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .drill-progress-fill {
      height: 100%; background: var(--cyan);
      border-radius: 2px; transition: width .3s ease;
    }
    .drill-progress-label {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
      min-width: 52px; text-align: right;
    }

    .drill-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      max-width: 720px;
    }
    .drill-card-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-2);
      margin-bottom: 16px;
    }
    .drill-card-heading {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
    }
    .drill-card-prompt {
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
    }
    .drill-card-body {
      font-size: 13.5px; line-height: 1.7;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
      min-height: 80px;
    }
    .drill-hidden {
      display: flex; align-items: center; justify-content: center;
      height: 80px;
      background: var(--card2); border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .drill-hidden-text { font-size: 13px; color: var(--text-3); }

    .drill-reveal-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px; font-weight: 600;
      color: var(--text);
      transition: background .15s, border-color .15s;
    }
    .drill-reveal-btn:hover { background: #1d2840; border-color: var(--cyan-dim); }

    .drill-rating { margin-top: 20px; }
    .drill-rating-label {
      font-size: 12px; color: var(--text-2); margin-bottom: 10px;
    }
    .drill-rating-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .rating-btn {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 56px;
      transition: background .15s, border-color .15s;
    }
    .rating-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rating-num { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
    .rating-desc { font-size: 10px; color: var(--text-3); margin-top: 2px; }
    .rating-btn.q0, .rating-btn.q1 { border-color: rgba(224,85,85,.4); }
    .rating-btn.q0:hover, .rating-btn.q1:hover { background: rgba(224,85,85,.12); }
    .rating-btn.q0 .rating-num, .rating-btn.q1 .rating-num { color: var(--red); }
    .rating-btn.q2, .rating-btn.q3 { border-color: rgba(245,166,35,.35); }
    .rating-btn.q2:hover, .rating-btn.q3:hover { background: rgba(245,166,35,.1); }
    .rating-btn.q2 .rating-num, .rating-btn.q3 .rating-num { color: var(--amber); }
    .rating-btn.q4, .rating-btn.q5 { border-color: rgba(61,224,138,.3); }
    .rating-btn.q4:hover, .rating-btn.q5:hover { background: rgba(61,224,138,.1); }
    .rating-btn.q4 .rating-num, .rating-btn.q5 .rating-num { color: var(--green); }

    .drill-done {
      display: flex; flex-direction: column; align-items: center;
      padding: 80px 0; gap: 12px;
    }
    .drill-done-icon { font-size: 48px; color: var(--green); }
    .drill-done-title {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
    }
    .drill-done-sub { color: var(--text-2); font-size: 14px; }
    .drill-restart {
      margin-top: 16px; padding: 10px 28px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-weight: 600;
      color: var(--text); transition: background .15s;
    }
    .drill-restart:hover { background: #1d2840; }

    /* ── stat row (home header) ─────────────────────────────────────── */
    .stat-row {
      display: flex; gap: 20px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 20px; min-width: 140px;
    }
    .stat-label { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--cyan); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.red   { color: var(--red); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
