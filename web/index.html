<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLAS Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "preact":       "https://esm.sh/preact@10.23.1",
      "preact/hooks": "https://esm.sh/preact@10.23.1/hooks",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
    }
  }
  </script>

  <style>
    /* ── design tokens ──────────────────────────────────────────────── */
    :root {
      --bg:       #0a0d12;
      --bg2:      #0f1318;
      --card:     #141920;
      --card2:    #1a2130;
      --border:   #1e2a38;
      --cyan:     #3ad6e0;
      --cyan-dim: #1f8a90;
      --amber:    #f5a623;
      --amber-bg: #2a1f0a;
      --red:      #e05555;
      --green:    #3de08a;
      --green-bg: #0a1f14;
      --navy:     #0d1a2e;
      --text:     #e2e8f0;
      --text-2:   #8899aa;
      --text-3:   #4a5568;
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      --radius:   8px;
      --radius-lg: 12px;
    }

    /* ── reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ── scrollbar ──────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── layout ─────────────────────────────────────────────────────── */
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── topbar ─────────────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-brand {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }
    .topbar-brand span { color: var(--text-2); font-weight: 600; font-size: 13px; margin-left: 10px; letter-spacing: 0.04em; }
    .topbar-nav { display: flex; gap: 6px; }
    .nav-btn {
      padding: 5px 14px;
      border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      transition: color .15s, background .15s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--card2);
      color: var(--text);
    }

    /* ── main content ───────────────────────────────────────────────── */
    .main { flex: 1; padding: 32px 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── page title ─────────────────────────────────────────────────── */
    .page-title {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700;
      margin-bottom: 6px;
    }
    .page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

    /* ── band chips ─────────────────────────────────────────────────── */
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 9px; border-radius: 4px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
      font-family: var(--font-mono);
    }
    .chip-crit  { background: rgba(240,100,80,.18); color: #f06450; border: 1px solid rgba(240,100,80,.35); }
    .chip-focus { background: rgba(245,166,35,.14); color: var(--amber); border: 1px solid rgba(245,166,35,.3); }
    .chip-hold  { background: rgba(58,214,224,.1);  color: var(--cyan-dim); border: 1px solid rgba(58,214,224,.2); }

    /* ── topic rows (home) ───────────────────────────────────────────── */
    .topic-grid { display: flex; flex-direction: column; gap: 10px; }

    .topic-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color .15s;
    }
    .topic-row:hover { border-color: var(--cyan-dim); }
    .topic-row.crit { border-left: 3px solid #f06450; }
    .topic-row.focus { border-left: 3px solid var(--amber); }
    .topic-row.hold { border-left: 3px solid var(--cyan-dim); }

    .topic-header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }

    .topic-name {
      font-weight: 600; font-size: 15px;
      display: flex; align-items: center; gap: 10px;
    }

    .mastery-bar-wrap {
      display: flex; align-items: center; gap: 10px;
      min-width: 160px;
    }
    .mastery-bar {
      flex: 1; height: 6px;
      background: var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .mastery-fill {
      height: 100%; border-radius: 3px;
      background: var(--cyan);
      transition: width .4s ease;
    }
    .mastery-fill.low { background: #f06450; }
    .mastery-fill.mid { background: var(--amber); }
    .mastery-val {
      font-family: var(--font-mono);
      font-size: 12px; color: var(--text-2);
      min-width: 32px; text-align: right;
    }

    .focus-score {
      font-family: var(--font-mono);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      min-width: 60px; text-align: right;
    }
    .focus-score.high { color: var(--amber); }

    .expand-icon {
      color: var(--text-3); font-size: 12px;
      transition: transform .2s;
    }
    .topic-row.open .expand-icon { transform: rotate(180deg); }

    /* ── readings panel ─────────────────────────────────────────────── */
    .readings-panel {
      border-top: 1px solid var(--border);
      padding: 12px 20px 16px;
      display: none;
    }
    .topic-row.open .readings-panel { display: block; }

    .readings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .reading-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .reading-card:hover {
      border-color: var(--cyan-dim);
      background: #1d2840;
    }
    .reading-title {
      font-size: 13px; font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .reading-meta {
      font-size: 11px; color: var(--text-2);
      font-family: var(--font-mono);
      display: flex; gap: 10px;
    }

    /* ── reading view ───────────────────────────────────────────────── */
    .reading-layout {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .reading-layout { grid-template-columns: 1fr; }
      .los-rail { order: -1; }
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-2);
      margin-bottom: 20px;
      padding: 5px 10px;
      border-radius: var(--radius);
      transition: color .15s, background .15s;
    }
    .back-btn:hover { color: var(--text); background: var(--card); }

    .doc-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      margin-bottom: 6px;
    }
    .doc-meta {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--text-2);
      margin-bottom: 28px;
    }

    /* ── chunk cards ────────────────────────────────────────────────── */
    .chunk-list { display: flex; flex-direction: column; gap: 12px; }

    .chunk-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }

    .chunk-card.formula {
      background: var(--navy);
      border-color: rgba(58,214,224,.35);
      border-left: 3px solid var(--cyan);
    }

    .chunk-card.example {
      background: var(--green-bg);
      border-color: rgba(61,224,138,.25);
      border-left: 3px solid var(--green);
    }

    .chunk-heading {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .chunk-type-tag {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 3px;
      letter-spacing: 0.06em;
    }
    .chunk-card.formula .chunk-type-tag {
      background: rgba(58,214,224,.15); color: var(--cyan);
    }
    .chunk-card.example .chunk-type-tag {
      background: rgba(61,224,138,.15); color: var(--green);
    }

    .section-divider {
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      padding: 8px 0 4px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .chunk-body {
      font-size: 13.5px; line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chunk-card.formula .chunk-body {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #c9e8ec;
    }

    /* example toggle */
    .example-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--green);
      font-weight: 600; margin-top: 10px;
      padding: 0; background: none; border: none;
      cursor: pointer; font-family: var(--font-body);
    }

    /* ── LOS rail ───────────────────────────────────────────────────── */
    .los-rail {
      position: sticky; top: 72px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .los-rail-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
    }
    .los-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px; line-height: 1.5;
    }
    .los-item:last-child { border-bottom: none; }
    .los-num {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--cyan); font-weight: 600;
      min-width: 24px; margin-top: 1px;
    }
    .los-text { color: var(--text-2); }
    .los-verb {
      display: inline-block; margin-top: 2px;
      font-size: 10px; font-weight: 700;
      background: rgba(58,214,224,.1); color: var(--cyan-dim);
      padding: 0 5px; border-radius: 3px;
      font-family: var(--font-mono);
    }

    /* ── loading / error states ─────────────────────────────────────── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: var(--text-3); font-size: 14px;
    }
    .loader-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--cyan); margin: 0 3px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: .2s; }
    .loader-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,80%,100% { opacity: .2; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .error-box {
      background: rgba(224,85,85,.1); border: 1px solid rgba(224,85,85,.3);
      border-radius: var(--radius); padding: 16px; color: var(--red);
      font-size: 13px;
    }

    /* ── filter bar (formulas + drill) ──────────────────────────────────── */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: 12px; font-weight: 500;
      color: var(--text-2);
      border: 1px solid var(--border);
      transition: color .15s, background .15s, border-color .15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--cyan-dim); }
    .filter-btn.active { background: var(--card2); color: var(--cyan); border-color: var(--cyan-dim); }

    /* ── formula sheet ──────────────────────────────────────────────────── */
    .formula-group { margin-bottom: 32px; }
    .formula-group-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .formula-group-name {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
    }
    .formula-card {
      background: var(--navy);
      border: 1px solid rgba(58,214,224,.25);
      border-left: 3px solid var(--cyan);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
    }
    .formula-card-heading {
      font-size: 12px; font-weight: 700;
      color: var(--cyan); letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .formula-card-body {
      font-family: var(--font-mono);
      font-size: 13px; line-height: 1.7;
      color: #c9e8ec; white-space: pre-wrap; word-break: break-word;
    }
    .formula-card-meta {
      font-size: 11px; color: var(--text-3);
      font-family: var(--font-mono);
      margin-top: 8px;
    }
    .empty-state {
      text-align: center; color: var(--text-3);
      font-size: 14px; padding: 60px 0;
    }

    /* ── example drill ──────────────────────────────────────────────────── */
    .drill-progress {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .drill-progress-bar {
      flex: 1; height: 4px;
      background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .drill-progress-fill {
      height: 100%; background: var(--cyan);
      border-radius: 2px; transition: width .3s ease;
    }
    .drill-progress-label {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
      min-width: 52px; text-align: right;
    }

    .drill-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      max-width: 720px;
    }
    .drill-card-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-2);
      margin-bottom: 16px;
    }
    .drill-card-heading {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
    }
    .drill-card-prompt {
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
    }
    .drill-card-body {
      font-size: 13.5px; line-height: 1.7;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
      min-height: 80px;
    }
    .drill-hidden {
      display: flex; align-items: center; justify-content: center;
      height: 80px;
      background: var(--card2); border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .drill-hidden-text { font-size: 13px; color: var(--text-3); }

    .drill-reveal-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px; font-weight: 600;
      color: var(--text);
      transition: background .15s, border-color .15s;
    }
    .drill-reveal-btn:hover { background: #1d2840; border-color: var(--cyan-dim); }

    .drill-rating { margin-top: 20px; }
    .drill-rating-label {
      font-size: 12px; color: var(--text-2); margin-bottom: 10px;
    }
    .drill-rating-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .rating-btn {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 56px;
      transition: background .15s, border-color .15s;
    }
    .rating-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rating-num { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
    .rating-desc { font-size: 10px; color: var(--text-3); margin-top: 2px; }
    .rating-btn.q0, .rating-btn.q1 { border-color: rgba(224,85,85,.4); }
    .rating-btn.q0:hover, .rating-btn.q1:hover { background: rgba(224,85,85,.12); }
    .rating-btn.q0 .rating-num, .rating-btn.q1 .rating-num { color: var(--red); }
    .rating-btn.q2, .rating-btn.q3 { border-color: rgba(245,166,35,.35); }
    .rating-btn.q2:hover, .rating-btn.q3:hover { background: rgba(245,166,35,.1); }
    .rating-btn.q2 .rating-num, .rating-btn.q3 .rating-num { color: var(--amber); }
    .rating-btn.q4, .rating-btn.q5 { border-color: rgba(61,224,138,.3); }
    .rating-btn.q4:hover, .rating-btn.q5:hover { background: rgba(61,224,138,.1); }
    .rating-btn.q4 .rating-num, .rating-btn.q5 .rating-num { color: var(--green); }

    .drill-done {
      display: flex; flex-direction: column; align-items: center;
      padding: 80px 0; gap: 12px;
    }
    .drill-done-icon { font-size: 48px; color: var(--green); }
    .drill-done-title {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
    }
    .drill-done-sub { color: var(--text-2); font-size: 14px; }
    .drill-restart {
      margin-top: 16px; padding: 10px 28px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-weight: 600;
      color: var(--text); transition: background .15s;
    }
    .drill-restart:hover { background: #1d2840; }

    /* ── LOS tracker ───────────────────────────────────────────────────── */
    .los-toolbar {
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 24px;
    }
    .mode-toggle {
      display: flex; gap: 6px;
    }
    .mode-btn {
      padding: 6px 16px;
      border-radius: var(--radius);
      font-size: 13px; font-weight: 600;
      color: var(--text-2);
      border: 1px solid var(--border);
      transition: color .15s, background .15s, border-color .15s;
    }
    .mode-btn:hover { color: var(--text); border-color: var(--cyan-dim); }
    .mode-btn.active { background: var(--card2); color: var(--cyan); border-color: var(--cyan-dim); }

    .los-browse { display: flex; flex-direction: column; gap: 24px; }
    .los-topic-group {}
    .los-topic-header {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 8px; margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .los-topic-name {
      font-family: var(--font-display); font-size: 15px; font-weight: 700;
    }
    .los-topic-count {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
      margin-left: auto;
    }

    .los-browse-list { display: flex; flex-direction: column; gap: 6px; }
    .los-browse-row {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
    }
    .los-browse-row.due { border-left: 3px solid var(--amber); }

    .los-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; margin-top: 5px;
    }
    .los-dot.new    { background: var(--text-3); }
    .los-dot.weak   { background: var(--red); }
    .los-dot.mid    { background: var(--amber); }
    .los-dot.strong { background: var(--green); }

    .los-browse-content { flex: 1; }
    .los-browse-num {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 11px; color: var(--cyan);
      font-weight: 600; margin-bottom: 4px;
    }
    .los-browse-text {
      font-size: 13px; line-height: 1.6; color: var(--text);
    }
    .los-browse-meta {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
      margin-top: 4px;
    }

    /* ── stat row (home header) ─────────────────────────────────────── */
    .stat-row {
      display: flex; gap: 20px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 20px; min-width: 140px;
    }
    .stat-label { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--cyan); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.red   { color: var(--red); }

    /* ── light theme tokens ─────────────────────────────────────────── */
    :root[data-theme="light"] {
      --bg:       #f5f7fa;
      --bg2:      #ffffff;
      --card:     #ffffff;
      --card2:    #eef1f5;
      --border:   #d4dae3;
      --cyan:     #0f7f88;
      --cyan-dim: #1a9aa4;
      --amber:    #c07a10;
      --amber-bg: #fef3dc;
      --red:      #c0392b;
      --green:    #1a8a56;
      --green-bg: #e8f9f0;
      --navy:     #eef5ff;
      --text:     #1a202c;
      --text-2:   #4a5568;
      --text-3:   #a0aec0;
    }

    /* ── theme toggle ───────────────────────────────────────────────── */
    .theme-toggle {
      display: flex; align-items: center;
      padding: 5px 10px; border-radius: var(--radius);
      font-size: 13px; color: var(--text-2);
      border: 1px solid var(--border);
      gap: 5px;
      transition: color .15s, background .15s;
    }
    .theme-toggle:hover { color: var(--text); background: var(--card); }

    /* ── topbar reading dim ─────────────────────────────────────────── */
    .topbar-dim {
      opacity: 0.7;
      transition: opacity .2s;
    }
    .topbar-dim:hover { opacity: 1; }

    /* ── reading shell ──────────────────────────────────────────────── */
    .main-reading {
      padding: 0 !important;
      max-width: 100% !important;
    }

    .reading-shell {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 57px);
    }

    .read-header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }

    .read-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-2);
      padding: 4px 8px; border-radius: var(--radius);
      margin-bottom: 10px;
      transition: color .15s, background .15s;
    }
    .read-back:hover { color: var(--text); background: var(--card2); }

    .read-title {
      font-family: var(--font-display);
      font-size: 20px; font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .read-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--text-2);
      font-family: var(--font-mono);
    }

    /* ── progress rail ──────────────────────────────────────────────── */
    .read-rail {
      display: flex; gap: 2px;
      padding: 12px 28px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .read-rail::-webkit-scrollbar { height: 3px; }

    .read-rail-seg {
      flex: 1; min-width: 6px; max-width: 24px;
      height: 6px; border-radius: 3px;
      background: var(--border);
      transition: background .2s;
      cursor: pointer;
    }
    .read-rail-seg.untouched { background: var(--border); }
    .read-rail-seg.viewed    { background: var(--cyan-dim); }
    .read-rail-seg.done      { background: var(--cyan); }
    .read-rail-seg.current   { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

    /* color by kind */
    .read-rail-seg.kind-los      { border-top: 2px solid #7c5cfc; }
    .read-rail-seg.kind-concept  { border-top: 2px solid var(--cyan); }
    .read-rail-seg.kind-example  { border-top: 2px solid var(--green); }
    .read-rail-seg.kind-practice { border-top: 2px solid var(--amber); }
    .read-rail-seg.kind-recap    { border-top: 2px solid #f06450; }

    /* ── read body ──────────────────────────────────────────────────── */
    .read-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 28px;
    }

    /* ── unit shell ─────────────────────────────────────────────────── */
    .unit-shell {
      width: 100%; max-width: 680px;
      margin-bottom: 32px;
    }

    .unit-kind-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }

    .unit-kind-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .unit-kind-badge.los      { background: rgba(124,92,252,.15); color: #a585ff; border: 1px solid rgba(124,92,252,.3); }
    .unit-kind-badge.concept  { background: rgba(58,214,224,.1);  color: var(--cyan); border: 1px solid rgba(58,214,224,.25); }
    .unit-kind-badge.example  { background: rgba(61,224,138,.1);  color: var(--green); border: 1px solid rgba(61,224,138,.25); }
    .unit-kind-badge.practice { background: rgba(245,166,35,.1);  color: var(--amber); border: 1px solid rgba(245,166,35,.25); }
    .unit-kind-badge.recap    { background: rgba(240,100,80,.1);  color: #f06450; border: 1px solid rgba(240,100,80,.25); }

    .unit-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    /* ── prose rendering (concept/recap) ───────────────────────────── */
    .unit-prose {
      font-family: var(--font-body);
      font-size: 16px; line-height: 1.75;
      color: var(--text);
    }
    .unit-prose p { margin-bottom: 1em; }
    .unit-prose strong { font-weight: 600; color: var(--text); }
    .unit-prose em { font-style: italic; }
    .unit-prose code {
      font-family: var(--font-mono);
      font-size: 14px;
      background: var(--card2); color: var(--cyan);
      padding: 1px 5px; border-radius: 3px;
    }

    /* ── LOS unit ───────────────────────────────────────────────────── */
    .unit-los {}
    .los-outcome-list { display: flex; flex-direction: column; gap: 12px; }
    .los-outcome-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .los-outcome-num {
      font-family: var(--font-mono); font-size: 11px;
      color: #a585ff; font-weight: 700;
      min-width: 28px;
    }
    .los-outcome-body { flex: 1; font-size: 15px; line-height: 1.6; }
    .los-outcome-verb {
      display: inline-block; margin-top: 6px;
      font-size: 10px; font-weight: 700;
      background: rgba(124,92,252,.12); color: #a585ff;
      padding: 1px 6px; border-radius: 3px;
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    }

    /* ── concept unit ───────────────────────────────────────────────── */
    .unit-concept {}
    .concept-formulas { margin-top: 24px; }
    .concept-formula-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 8px;
    }
    .concept-formula-card {
      background: var(--navy);
      border: 1px solid rgba(58,214,224,.25);
      border-left: 3px solid var(--cyan);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 14px; line-height: 1.7;
      color: #c9e8ec; white-space: pre-wrap;
      margin-bottom: 8px;
    }
    .concept-key-terms { margin-top: 24px; }
    .concept-key-terms-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 8px;
    }
    .concept-key-terms-list {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .key-term-chip {
      padding: 3px 10px; border-radius: 4px;
      font-size: 12px; font-weight: 600;
      background: var(--card2); color: var(--text-2);
      border: 1px solid var(--border);
    }

    /* ── example unit ───────────────────────────────────────────────── */
    .unit-example {}
    .example-prompt {
      font-size: 16px; line-height: 1.75;
      color: var(--text); margin-bottom: 20px;
    }
    .example-reveal-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      background: var(--green-bg);
      border: 1px solid rgba(61,224,138,.3);
      color: var(--green); font-size: 14px; font-weight: 600;
      margin-bottom: 20px;
      transition: background .15s;
    }
    .example-reveal-btn:hover { background: rgba(61,224,138,.15); }
    .example-solution {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .example-step {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px; line-height: 1.7;
    }
    .example-step:last-child { border-bottom: none; }
    .example-step-num {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--green); font-weight: 700;
      margin-bottom: 4px;
    }
    .example-answer {
      margin-top: 16px; padding-top: 14px;
      border-top: 1px solid var(--border);
      font-weight: 600; color: var(--green);
    }

    /* ── practice unit ──────────────────────────────────────────────── */
    .unit-practice {}
    .practice-vignette {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--amber);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: 15px; line-height: 1.75;
      margin-bottom: 20px;
    }
    .practice-question {
      font-size: 16px; font-weight: 600;
      line-height: 1.5; margin-bottom: 16px;
    }
    .practice-choices {
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 20px;
    }
    .practice-choice {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 14px; line-height: 1.5;
      background: var(--card); cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: left;
    }
    .practice-choice:hover:not(:disabled) { border-color: var(--cyan-dim); background: var(--card2); }
    .practice-choice.selected  { border-color: var(--cyan); background: rgba(58,214,224,.07); }
    .practice-choice.correct   { border-color: var(--green); background: var(--green-bg); }
    .practice-choice.wrong     { border-color: var(--red);   background: rgba(224,85,85,.07); }
    .practice-choice:disabled  { cursor: default; }
    .practice-choice-label {
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      color: var(--text-3); min-width: 18px;
    }
    .practice-choice.correct .practice-choice-label { color: var(--green); }
    .practice-choice.wrong   .practice-choice-label { color: var(--red); }

    .practice-submit-btn {
      padding: 10px 28px; border-radius: var(--radius);
      background: var(--cyan); color: var(--bg);
      font-size: 14px; font-weight: 700;
      transition: opacity .15s;
    }
    .practice-submit-btn:disabled { opacity: .4; cursor: not-allowed; }
    .practice-submit-btn:not(:disabled):hover { opacity: .85; }

    .practice-solution {
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }
    .practice-solution-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 10px;
    }
    .practice-solution-body {
      font-size: 15px; line-height: 1.75; color: var(--text);
    }
    .practice-stub-note {
      background: var(--amber-bg);
      border: 1px solid rgba(245,166,35,.3);
      border-radius: var(--radius);
      padding: 16px; font-size: 13px; color: var(--amber);
    }
    .practice-stub-note code {
      font-family: var(--font-mono); background: rgba(245,166,35,.15);
      padding: 1px 5px; border-radius: 3px;
    }

    /* ── recap unit ─────────────────────────────────────────────────── */
    .unit-recap {}
    .recap-next-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 28px; padding: 12px 28px;
      border-radius: var(--radius);
      background: var(--cyan); color: var(--bg);
      font-size: 15px; font-weight: 700;
      transition: opacity .15s;
    }
    .recap-next-btn:hover { opacity: .85; }

    /* ── confidence bar ─────────────────────────────────────────────── */
    .unit-confidence {
      display: flex; align-items: center; gap: 8px;
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .unit-confidence-label {
      font-size: 12px; color: var(--text-3); margin-right: 4px;
    }
    .conf-btn {
      padding: 6px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 600;
      border: 1px solid var(--border);
      transition: background .15s, border-color .15s, color .15s;
    }
    .conf-btn:hover { border-color: var(--cyan-dim); }
    .conf-btn.active-got    { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .conf-btn.active-shaky  { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
    .conf-btn.active-review { background: rgba(224,85,85,.1); border-color: var(--red); color: var(--red); }

    /* ── read navigation ────────────────────────────────────────────── */
    .read-nav {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; gap: 12px;
      margin-top: 12px;
    }
    .read-nav-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 14px; font-weight: 600; color: var(--text-2);
      background: var(--card);
      transition: color .15s, border-color .15s, background .15s;
      flex: 1;
    }
    .read-nav-btn.next { justify-content: flex-end; }
    .read-nav-btn:hover:not(:disabled) { color: var(--text); border-color: var(--cyan-dim); background: var(--card2); }
    .read-nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .read-nav-label { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
    .read-nav-spacer { flex: 1; }

    /* ── reading complete ───────────────────────────────────────────── */
    .read-complete {
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 0; gap: 12px; text-align: center;
    }
    .read-complete-icon { font-size: 56px; }
    .read-complete-title {
      font-family: var(--font-display); font-size: 24px; font-weight: 700;
    }
    .read-complete-sub { color: var(--text-2); font-size: 15px; max-width: 380px; }

    /* ── rendered markdown: hierarchy ───────────────────────────────── */
    /* Headings step down in size and colour so a scan reveals structure
       before any of the prose is read. */
    .unit-prose .md-h {
      font-family: var(--font-display);
      line-height: 1.3;
      margin: 1.6em 0 .6em;
      scroll-margin-top: 80px;
    }
    .unit-prose .md-h:first-child { margin-top: 0; }
    .unit-prose .md-h2 {
      font-size: 20px; font-weight: 700; color: var(--text);
      padding-bottom: .3em; border-bottom: 1px solid var(--border);
    }
    .unit-prose .md-h3 {
      font-size: 17px; font-weight: 700; color: var(--cyan);
      letter-spacing: .01em;
    }
    .unit-prose .md-h4 {
      font-size: 15px; font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .06em;
    }

    .unit-prose p { margin: 0 0 1em; }
    .unit-prose p:last-child { margin-bottom: 0; }
    .unit-prose strong { font-weight: 600; color: var(--text); }

    /* ── rendered markdown: lists ───────────────────────────────────── */
    .unit-prose .md-list {
      margin: 0 0 1.1em; padding-left: 1.35em;
      display: flex; flex-direction: column; gap: .45em;
    }
    .unit-prose .md-list li {
      line-height: 1.7; padding-left: .2em;
    }
    .unit-prose ul.md-list { list-style: none; padding-left: 1.1em; }
    .unit-prose ul.md-list li { position: relative; }
    .unit-prose ul.md-list li::before {
      content: "▪";
      position: absolute; left: -1.1em; top: 0;
      color: var(--cyan); font-size: 13px; line-height: 1.7;
    }
    .unit-prose ol.md-list li::marker {
      color: var(--cyan); font-family: var(--font-mono);
      font-size: 13px; font-weight: 600;
    }

    /* ── rendered markdown: tables ──────────────────────────────────── */
    /* Wrapper scrolls on its own so a wide table never scrolls the page. */
    .md-table-wrap {
      overflow-x: auto;
      margin: 0 0 1.3em;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    .md-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    .md-table th {
      text-align: left;
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--cyan);
      background: var(--card2);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      position: sticky; top: 0;
    }
    .md-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      line-height: 1.6;
      vertical-align: top;
      color: var(--text);
    }
    .md-table tbody tr:last-child td { border-bottom: none; }
    .md-table tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
    :root[data-theme="light"] .md-table tbody tr:nth-child(even) { background: rgba(0,0,0,.02); }
    .md-table tbody tr:hover { background: rgba(58,214,224,.05); }

    /* ── rendered markdown: callouts ────────────────────────────────── */
    /* Tier separation: an exam key reads differently from a passing note. */
    .md-callout {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 16px;
      margin: 0 0 1.2em;
      border-radius: var(--radius);
      border-left: 3px solid var(--border);
      background: var(--card);
      font-size: 15px; line-height: 1.65;
    }
    .md-callout-tag {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 700;
      letter-spacing: .08em;
      padding: 2px 7px; border-radius: 3px;
      margin-top: 2px;
    }
    .md-callout-body { flex: 1; }

    .md-callout-key {
      border-left-color: var(--amber);
      background: var(--amber-bg);
    }
    .md-callout-key .md-callout-tag { background: rgba(245,166,35,.18); color: var(--amber); }

    .md-callout-note {
      border-left-color: var(--cyan);
      background: var(--navy);
    }
    .md-callout-note .md-callout-tag { background: rgba(58,214,224,.15); color: var(--cyan); }

    .md-callout-warn {
      border-left-color: var(--red);
      background: rgba(224,85,85,.08);
    }
    .md-callout-warn .md-callout-tag { background: rgba(224,85,85,.18); color: var(--red); }

    /* ── rendered markdown: quotes / asides ─────────────────────────── */
    /* Supporting detail sits back visually from must-know content. */
    .unit-prose .md-quote {
      margin: 0 0 1.2em;
      padding: 2px 0 2px 16px;
      border-left: 2px solid var(--border);
      color: var(--text-2);
      font-size: 14.5px;
      font-style: italic;
    }

    .unit-prose .inline-code, .md-callout .inline-code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      background: var(--card2); color: var(--cyan);
      padding: 1px 5px; border-radius: 3px;
    }

    /* ── reading card meta ──────────────────────────────────────────── */
    .reading-meta-item { white-space: nowrap; }
    .reading-meta-item + .reading-meta-item::before {
      content: "·";
      margin-right: 10px;
      color: var(--text-3);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
