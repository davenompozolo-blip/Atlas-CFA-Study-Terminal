<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLAS Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "preact":       "https://esm.sh/preact@10.23.1",
      "preact/hooks": "https://esm.sh/preact@10.23.1/hooks",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
    }
  }
  </script>

  <style>
    /* ── design tokens ──────────────────────────────────────────────── */
    :root {
      --bg:       #0a0d12;
      --bg2:      #0f1318;
      --card:     #141920;
      --card2:    #1a2130;
      --border:   #1e2a38;
      --cyan:     #3ad6e0;
      --cyan-dim: #1f8a90;
      --amber:    #f5a623;
      --amber-bg: #2a1f0a;
      --red:      #e05555;
      --green:    #3de08a;
      --green-bg: #0a1f14;
      --navy:     #0d1a2e;
      --text:     #e2e8f0;
      --text-2:   #8899aa;
      --text-3:   #4a5568;
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      --radius:   8px;
      --radius-lg: 12px;
      --hover:    #1d2840;
    }

    /* ── reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ── scrollbar ──────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── layout ─────────────────────────────────────────────────────── */
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── topbar ─────────────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-brand {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }
    .topbar-brand span { color: var(--text-2); font-weight: 600; font-size: 13px; margin-left: 10px; letter-spacing: 0.04em; }
    .topbar-nav { display: flex; gap: 6px; }
    .nav-btn {
      padding: 5px 14px;
      border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      transition: color .15s, background .15s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--card2);
      color: var(--text);
    }

    /* ── main content ───────────────────────────────────────────────── */
    .main { flex: 1; padding: 32px 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── page title ─────────────────────────────────────────────────── */
    .page-title {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700;
      margin-bottom: 6px;
    }
    .page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

    /* ── band chips ─────────────────────────────────────────────────── */
    .chip {
      display: inline-flex; align-items: center;
      padding: 2px 9px; border-radius: 4px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
      font-family: var(--font-mono);
    }
    .chip-crit  { background: rgba(240,100,80,.18); color: #f06450; border: 1px solid rgba(240,100,80,.35); }
    .chip-focus { background: rgba(245,166,35,.14); color: var(--amber); border: 1px solid rgba(245,166,35,.3); }
    .chip-hold  { background: rgba(58,214,224,.1);  color: var(--cyan-dim); border: 1px solid rgba(58,214,224,.2); }

    /* ── topic rows (home) ───────────────────────────────────────────── */
    .topic-grid { display: flex; flex-direction: column; gap: 10px; }

    .topic-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color .15s;
    }
    .topic-row:hover { border-color: var(--cyan-dim); }
    .topic-row.crit { border-left: 3px solid #f06450; }
    .topic-row.focus { border-left: 3px solid var(--amber); }
    .topic-row.hold { border-left: 3px solid var(--cyan-dim); }

    .topic-header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }

    .topic-name {
      font-weight: 600; font-size: 15px;
      display: flex; align-items: center; gap: 10px;
    }

    .mastery-bar-wrap {
      display: flex; align-items: center; gap: 10px;
      min-width: 160px;
    }
    .mastery-bar {
      flex: 1; height: 6px;
      background: var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .mastery-fill {
      height: 100%; border-radius: 3px;
      background: var(--cyan);
      transition: width .4s ease;
    }
    .mastery-fill.low { background: #f06450; }
    .mastery-fill.mid { background: var(--amber); }
    .mastery-val {
      font-family: var(--font-mono);
      font-size: 12px; color: var(--text-2);
      min-width: 32px; text-align: right;
    }

    .focus-score {
      font-family: var(--font-mono);
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      min-width: 60px; text-align: right;
    }
    .focus-score.high { color: var(--amber); }

    .expand-icon {
      color: var(--text-3); font-size: 12px;
      transition: transform .2s;
    }
    .topic-row.open .expand-icon { transform: rotate(180deg); }

    /* ── readings panel ─────────────────────────────────────────────── */
    .readings-panel {
      border-top: 1px solid var(--border);
      padding: 12px 20px 16px;
      display: none;
    }
    .topic-row.open .readings-panel { display: block; }

    .readings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .reading-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .reading-card:hover {
      border-color: var(--cyan-dim);
      background: var(--hover);
    }
    .reading-title {
      font-size: 13px; font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .reading-meta {
      font-size: 11px; color: var(--text-2);
      font-family: var(--font-mono);
      display: flex; gap: 10px;
    }

    /* ── reading view ───────────────────────────────────────────────── */
    .reading-layout {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .reading-layout { grid-template-columns: 1fr; }
      .los-rail { order: -1; }
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-2);
      margin-bottom: 20px;
      padding: 5px 10px;
      border-radius: var(--radius);
      transition: color .15s, background .15s;
    }
    .back-btn:hover { color: var(--text); background: var(--card); }

    .doc-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      margin-bottom: 6px;
    }
    .doc-meta {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--text-2);
      margin-bottom: 28px;
    }

    /* ── chunk cards ────────────────────────────────────────────────── */
    .chunk-list { display: flex; flex-direction: column; gap: 12px; }

    .chunk-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }

    .chunk-card.formula {
      background: var(--navy);
      border-color: rgba(58,214,224,.35);
      border-left: 3px solid var(--cyan);
    }

    .chunk-card.example {
      background: var(--green-bg);
      border-color: rgba(61,224,138,.25);
      border-left: 3px solid var(--green);
    }

    .chunk-heading {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .chunk-type-tag {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 3px;
      letter-spacing: 0.06em;
    }
    .chunk-card.formula .chunk-type-tag {
      background: rgba(58,214,224,.15); color: var(--cyan);
    }
    .chunk-card.example .chunk-type-tag {
      background: rgba(61,224,138,.15); color: var(--green);
    }

    .section-divider {
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      padding: 8px 0 4px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .chunk-body {
      font-size: 13.5px; line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chunk-card.formula .chunk-body {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #c9e8ec;
    }

    /* example toggle */
    .example-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--green);
      font-weight: 600; margin-top: 10px;
      padding: 0; background: none; border: none;
      cursor: pointer; font-family: var(--font-body);
    }

    /* ── LOS rail ───────────────────────────────────────────────────── */
    .los-rail {
      position: sticky; top: 72px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .los-rail-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
    }
    .los-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px; line-height: 1.5;
    }
    .los-item:last-child { border-bottom: none; }
    .los-num {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--cyan); font-weight: 600;
      min-width: 24px; margin-top: 1px;
    }
    .los-text { color: var(--text-2); }
    .los-verb {
      display: inline-block; margin-top: 2px;
      font-size: 10px; font-weight: 700;
      background: rgba(58,214,224,.1); color: var(--cyan-dim);
      padding: 0 5px; border-radius: 3px;
      font-family: var(--font-mono);
    }

    /* ── loading / error states ─────────────────────────────────────── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: var(--text-3); font-size: 14px;
    }
    .loader-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--cyan); margin: 0 3px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: .2s; }
    .loader-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,80%,100% { opacity: .2; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .error-box {
      background: rgba(224,85,85,.1); border: 1px solid rgba(224,85,85,.3);
      border-radius: var(--radius); padding: 16px; color: var(--red);
      font-size: 13px;
    }

    /* ── filter bar (formulas + drill) ──────────────────────────────────── */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: 12px; font-weight: 500;
      color: var(--text-2);
      border: 1px solid var(--border);
      transition: color .15s, background .15s, border-color .15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--cyan-dim); }
    .filter-btn.active { background: var(--card2); color: var(--cyan); border-color: var(--cyan-dim); }

    /* ── formula sheet ──────────────────────────────────────────────────── */
    .formula-group { margin-bottom: 32px; }
    .formula-group-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .formula-group-name {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
    }
    .formula-card {
      background: var(--navy);
      border: 1px solid rgba(58,214,224,.25);
      border-left: 3px solid var(--cyan);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
    }
    .formula-card-heading {
      font-size: 12px; font-weight: 700;
      color: var(--cyan); letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .formula-card-body {
      font-family: var(--font-mono);
      font-size: 13px; line-height: 1.7;
      color: #c9e8ec; white-space: pre-wrap; word-break: break-word;
    }
    .formula-card-meta {
      font-size: 11px; color: var(--text-3);
      font-family: var(--font-mono);
      margin-top: 8px;
    }
    .empty-state {
      text-align: center; color: var(--text-3);
      font-size: 14px; padding: 60px 0;
    }

    /* ── example drill ──────────────────────────────────────────────────── */
    .drill-progress {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .drill-progress-bar {
      flex: 1; height: 4px;
      background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .drill-progress-fill {
      height: 100%; background: var(--cyan);
      border-radius: 2px; transition: width .3s ease;
    }
    .drill-progress-label {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
      min-width: 52px; text-align: right;
    }

    .drill-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      max-width: 720px;
    }
    .drill-card-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-2);
      margin-bottom: 16px;
    }
    .drill-card-heading {
      font-size: 16px; font-weight: 700;
      margin-bottom: 16px;
    }
    .drill-card-prompt {
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 12px;
    }
    .drill-card-body {
      font-size: 13.5px; line-height: 1.7;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
      min-height: 80px;
    }
    .drill-hidden {
      display: flex; align-items: center; justify-content: center;
      height: 80px;
      background: var(--card2); border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .drill-hidden-text { font-size: 13px; color: var(--text-3); }

    .drill-reveal-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px; font-weight: 600;
      color: var(--text);
      transition: background .15s, border-color .15s;
    }
    .drill-reveal-btn:hover { background: var(--hover); border-color: var(--cyan-dim); }

    .drill-rating { margin-top: 20px; }
    .drill-rating-label {
      font-size: 12px; color: var(--text-2); margin-bottom: 10px;
    }
    .drill-rating-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .rating-btn {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 56px;
      transition: background .15s, border-color .15s;
    }
    .rating-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rating-num { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
    .rating-desc { font-size: 10px; color: var(--text-3); margin-top: 2px; }
    .rating-btn.q0, .rating-btn.q1 { border-color: rgba(224,85,85,.4); }
    .rating-btn.q0:hover, .rating-btn.q1:hover { background: rgba(224,85,85,.12); }
    .rating-btn.q0 .rating-num, .rating-btn.q1 .rating-num { color: var(--red); }
    .rating-btn.q2, .rating-btn.q3 { border-color: rgba(245,166,35,.35); }
    .rating-btn.q2:hover, .rating-btn.q3:hover { background: rgba(245,166,35,.1); }
    .rating-btn.q2 .rating-num, .rating-btn.q3 .rating-num { color: var(--amber); }
    .rating-btn.q4, .rating-btn.q5 { border-color: rgba(61,224,138,.3); }
    .rating-btn.q4:hover, .rating-btn.q5:hover { background: rgba(61,224,138,.1); }
    .rating-btn.q4 .rating-num, .rating-btn.q5 .rating-num { color: var(--green); }

    .drill-done {
      display: flex; flex-direction: column; align-items: center;
      padding: 80px 0; gap: 12px;
    }
    .drill-done-icon { font-size: 48px; color: var(--green); }
    .drill-done-title {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
    }
    .drill-done-sub { color: var(--text-2); font-size: 14px; }
    .drill-restart {
      margin-top: 16px; padding: 10px 28px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-weight: 600;
      color: var(--text); transition: background .15s;
    }
    .drill-restart:hover { background: var(--hover); }

    /* ── LOS tracker ───────────────────────────────────────────────────── */
    .los-toolbar {
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 24px;
    }
    .mode-toggle {
      display: flex; gap: 6px;
    }
    .mode-btn {
      padding: 6px 16px;
      border-radius: var(--radius);
      font-size: 13px; font-weight: 600;
      color: var(--text-2);
      border: 1px solid var(--border);
      transition: color .15s, background .15s, border-color .15s;
    }
    .mode-btn:hover { color: var(--text); border-color: var(--cyan-dim); }
    .mode-btn.active { background: var(--card2); color: var(--cyan); border-color: var(--cyan-dim); }

    .los-browse { display: flex; flex-direction: column; gap: 24px; }
    .los-topic-group {}
    .los-topic-header {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 8px; margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .los-topic-name {
      font-family: var(--font-display); font-size: 15px; font-weight: 700;
    }
    .los-topic-count {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
      margin-left: auto;
    }

    .los-browse-list { display: flex; flex-direction: column; gap: 6px; }
    .los-browse-row {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
    }
    .los-browse-row.due { border-left: 3px solid var(--amber); }

    .los-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; margin-top: 5px;
    }
    .los-dot.new    { background: var(--text-3); }
    .los-dot.weak   { background: var(--red); }
    .los-dot.mid    { background: var(--amber); }
    .los-dot.strong { background: var(--green); }

    .los-browse-content { flex: 1; }
    .los-browse-num {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 11px; color: var(--cyan);
      font-weight: 600; margin-bottom: 4px;
    }
    .los-browse-text {
      font-size: 13px; line-height: 1.6; color: var(--text);
    }
    .los-browse-meta {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
      margin-top: 4px;
    }

    /* ── stat row (home header) ─────────────────────────────────────── */
    .stat-row {
      display: flex; gap: 20px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 20px; min-width: 140px;
    }
    .stat-label { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--cyan); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.red   { color: var(--red); }

    /* ── light theme tokens ─────────────────────────────────────────── */
    :root[data-theme="light"] {
      --bg:       #f5f7fa;
      --bg2:      #ffffff;
      --card:     #ffffff;
      --card2:    #eef1f5;
      --border:   #d4dae3;
      --cyan:     #0d6f78;
      --cyan-dim: #14848d;
      --amber:    #a86a08;
      --amber-bg: #fdf3e0;
      --red:      #b5342a;
      --green:    #157a4c;
      --green-bg: #e9f8f0;
      --navy:     #eaf3fb;
      --text:     #16202c;
      --text-2:   #4a5768;
      --text-3:   #8b98a8;
      --formula-text: #0b4a52;
      --hover:    #e3e9f2;
    }
    :root { --formula-text: #c9e8ec; }

    /* formula bodies must stay legible in both themes */
    .formula-card-body, .chunk-card.formula .chunk-body { color: var(--formula-text); }

    .theme-toggle {
      margin-left: auto;
      padding: 5px 10px; border-radius: var(--radius);
      font-size: 14px; line-height: 1;
      color: var(--text-2); border: 1px solid var(--border);
      background: var(--card);
    }
    .theme-toggle:hover { color: var(--text); border-color: var(--cyan-dim); }

    .topbar-dim { opacity: .75; transition: opacity .2s; }
    .topbar-dim:hover { opacity: 1; }

    /* ── reading shell ──────────────────────────────────────────────── */
    .main-reading { padding: 0 !important; max-width: 100% !important; }
    .reading-shell {
      width: 100%; max-width: 780px;
      margin: 0 auto;
      padding: 28px 24px 96px;
      display: flex; flex-direction: column;
    }

    .read-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .read-back-btn {
      padding: 5px 12px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500; color: var(--text-2);
      border: 1px solid var(--border); background: var(--card);
    }
    .read-back-btn:hover { color: var(--text); border-color: var(--cyan-dim); }
    .read-header-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-2); font-family: var(--font-mono);
    }

    .read-title {
      font-family: var(--font-display);
      font-size: 25px; font-weight: 700; line-height: 1.25;
      margin-bottom: 18px;
    }

    /* ── progress rail ──────────────────────────────────────────────── */
    .read-rail { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
    .read-rail-bar { display: flex; gap: 3px; width: 100%; }
    .read-rail-seg {
      flex: 1 1 0; min-width: 4px; height: 7px;
      border-radius: 3px; background: var(--border);
      cursor: pointer; transition: background .18s, transform .18s;
    }
    .read-rail-seg:hover { transform: scaleY(1.5); }
    .read-rail-seg.viewed  { background: var(--cyan-dim); }
    .read-rail-seg.done    { background: var(--cyan); }
    .read-rail-seg.current { background: var(--amber); box-shadow: 0 0 0 2px rgba(245,166,35,.28); }
    .read-rail-info {
      display: flex; gap: 16px; align-items: center;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
    }
    .read-rail-done { color: var(--green); }

    /* ── empty / loading states ─────────────────────────────────────── */
    .read-loading { padding: 60px 0; }
    .read-no-units {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px;
      color: var(--text-2); font-size: 14px;
    }
    .read-no-units-title {
      font-family: var(--font-display); font-size: 17px; font-weight: 700;
      color: var(--text); margin-bottom: 8px;
    }
    .read-cmd {
      margin-top: 12px; padding: 12px 14px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono); font-size: 12px; color: var(--cyan);
      overflow-x: auto; white-space: pre;
    }

    /* ── unit shell ─────────────────────────────────────────────────── */
    .unit-shell { width: 100%; }

    .unit-kind-badge {
      display: inline-flex; align-items: center; gap: 7px;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 4px 11px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--text-2);
      background: var(--card);
    }
    .unit-kind-icon { font-size: 12px; }
    .unit-kind-label { letter-spacing: .08em; }
    .read-nav-label { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
    .unit-est { color: var(--text-3); font-weight: 500; letter-spacing: .04em; }

    .unit-los      .unit-kind-badge { color: #a585ff; border-color: rgba(124,92,252,.4); background: rgba(124,92,252,.10); }
    .unit-concept  .unit-kind-badge { color: var(--cyan);  border-color: rgba(58,214,224,.4); background: rgba(58,214,224,.09); }
    .unit-example  .unit-kind-badge { color: var(--green); border-color: rgba(61,224,138,.4); background: rgba(61,224,138,.09); }
    .unit-practice .unit-kind-badge { color: var(--amber); border-color: rgba(245,166,35,.4); background: rgba(245,166,35,.09); }
    .unit-recap    .unit-kind-badge { color: #f06450;      border-color: rgba(240,100,80,.4); background: rgba(240,100,80,.09); }

    .unit-title {
      font-family: var(--font-display);
      font-size: 23px; font-weight: 700; line-height: 1.3;
      margin-bottom: 22px;
    }

    .unit-prose { font-size: 16px; line-height: 1.75; color: var(--text); }
    .unit-body-fallback { font-size: 15px; line-height: 1.75; white-space: pre-wrap; }

    /* ── LOS unit ───────────────────────────────────────────────────── */
    .unit-los-intro { color: var(--text-2); font-size: 15px; margin-bottom: 16px; }
    .unit-los-list {
      list-style: none; counter-reset: los;
      display: flex; flex-direction: column; gap: 10px;
    }
    .unit-los-item {
      counter-increment: los;
      position: relative;
      padding: 14px 16px 14px 52px;
      background: var(--card); border: 1px solid var(--border);
      border-left: 3px solid #7c5cfc;
      border-radius: var(--radius);
      font-size: 15px; line-height: 1.65;
    }
    .unit-los-item::before {
      content: counter(los);
      position: absolute; left: 16px; top: 13px;
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(124,92,252,.14); color: #a585ff;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    }
    .unit-los-item .los-verb {
      display: inline-block; margin-right: 6px;
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      background: rgba(124,92,252,.12); color: #a585ff;
      padding: 1px 6px; border-radius: 3px;
      vertical-align: 1px;
    }

    /* ── concept extras ─────────────────────────────────────────────── */
    .unit-formulas { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .formula-card-where { font-size: 12px; color: var(--text-3); margin-top: 8px; }
    .unit-key-terms { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
    .key-term {
      display: flex; gap: 10px; align-items: baseline;
      padding: 10px 14px; border-radius: var(--radius);
      background: var(--card2); border: 1px solid var(--border);
      font-size: 14px;
    }
    .key-term-word { font-weight: 700; color: var(--cyan); white-space: nowrap; }
    .key-term-def  { color: var(--text-2); line-height: 1.6; }

    /* ── example unit ───────────────────────────────────────────────── */
    .example-prompt {
      font-size: 16px; line-height: 1.75; margin-bottom: 18px;
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--card); border: 1px solid var(--border);
      border-left: 3px solid var(--green);
    }
    .example-steps {
      list-style: none; counter-reset: step;
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 18px;
    }
    .example-step {
      counter-increment: step;
      position: relative; padding: 12px 16px 12px 48px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .example-step::before {
      content: counter(step);
      position: absolute; left: 14px; top: 11px;
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(61,224,138,.14); color: var(--green);
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    }
    .example-step-text { font-size: 15px; line-height: 1.7; }
    .example-step-calc {
      margin-top: 6px; font-family: var(--font-mono);
      font-size: 13px; color: var(--formula-text);
    }
    .example-answer {
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--green-bg); border: 1px solid rgba(61,224,138,.3);
      font-size: 15px; line-height: 1.7;
    }
    .example-answer-label {
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--green);
    }

    /* ── practice unit ──────────────────────────────────────────────── */
    .practice-vignette {
      padding: 16px 18px; border-radius: var(--radius);
      background: var(--card); border: 1px solid var(--border);
      border-left: 3px solid var(--amber);
      font-size: 15px; line-height: 1.75; margin-bottom: 18px;
    }
    .practice-question { font-size: 16px; font-weight: 600; line-height: 1.55; margin-bottom: 16px; }
    .practice-choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .practice-choice {
      display: flex; gap: 11px; align-items: flex-start; text-align: left;
      padding: 13px 15px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--card);
      font-size: 14.5px; line-height: 1.6; color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .practice-choice:hover { border-color: var(--cyan-dim); }
    .practice-choice.selected { border-color: var(--cyan); background: rgba(58,214,224,.07); }
    .practice-choice.correct  { border-color: var(--green); background: var(--green-bg); }
    .practice-choice.wrong    { border-color: var(--red);   background: rgba(224,85,85,.08); }
    .choice-key {
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      color: var(--text-3); min-width: 16px;
    }
    .practice-choice.correct .choice-key { color: var(--green); }
    .practice-choice.wrong   .choice-key { color: var(--red); }

    .practice-submit {
      padding: 10px 26px; border-radius: var(--radius);
      background: var(--cyan); color: var(--bg);
      font-size: 14px; font-weight: 700;
    }
    .practice-submit:disabled { opacity: .4; cursor: not-allowed; }

    .practice-solution {
      margin-top: 18px; padding: 18px 20px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .practice-result { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
    .practice-result.correct { color: var(--green); }
    .practice-result.wrong   { color: var(--red); }
    .practice-solution-text { font-size: 15px; line-height: 1.75; color: var(--text); }

    .practice-stub-msg {
      padding: 18px 20px; border-radius: var(--radius);
      background: var(--amber-bg); border: 1px solid rgba(245,166,35,.35);
      color: var(--amber); font-size: 14px; line-height: 1.6;
    }

    /* ── recap unit ─────────────────────────────────────────────────── */
    .unit-recap-heading {
      font-family: var(--font-display); font-size: 15px; font-weight: 700;
      margin: 24px 0 10px; color: var(--text);
    }
    .unit-recap-los { display: flex; flex-wrap: wrap; gap: 6px; }
    .recap-los-num {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 4px;
      background: rgba(124,92,252,.12); color: #a585ff;
    }
    .unit-recap-next { display: flex; align-items: center; gap: 12px; margin-top: 28px; }
    .recap-next-btn {
      padding: 11px 26px; border-radius: var(--radius);
      background: var(--cyan); color: var(--bg);
      font-size: 14px; font-weight: 700;
    }

    /* ── confidence control ─────────────────────────────────────────── */
    .unit-confidence {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 30px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .unit-confidence-label { font-size: 13px; color: var(--text-3); }
    .unit-confidence-btns { display: flex; gap: 8px; }
    .conf-btn {
      padding: 7px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; color: var(--text-2);
      border: 1px solid var(--border); background: var(--card);
      transition: background .15s, border-color .15s, color .15s;
    }
    .conf-btn.green.active  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .conf-btn.amber.active  { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
    .conf-btn.red.active    { background: rgba(224,85,85,.1); border-color: var(--red); color: var(--red); }
    .conf-btn:hover { border-color: var(--cyan-dim); color: var(--text); }
    .unit-done-badge { font-size: 12px; color: var(--green); font-weight: 600; }

    /* ── prev / next navigation ─────────────────────────────────────── */
    .read-nav { display: flex; gap: 12px; margin-top: 36px; }
    .read-nav-btn {
      flex: 1; display: flex; align-items: center; gap: 8px;
      padding: 12px 18px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--card);
      color: var(--text-2); font-size: 13px; font-weight: 600;
      transition: color .15s, border-color .15s;
      min-width: 0;
    }
    .read-nav-btn.next { justify-content: flex-end; text-align: right; }
    .read-nav-btn:hover:not(:disabled) { color: var(--text); border-color: var(--cyan-dim); }
    .read-nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .read-nav-kind {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── reading complete ───────────────────────────────────────────── */
    .read-complete {
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 0; gap: 12px; text-align: center;
    }
    .read-complete-icon { font-size: 56px; }
    .read-complete-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
    .read-complete-sub { color: var(--text-2); font-size: 15px; max-width: 380px; }

    /* ── rendered markdown: hierarchy ───────────────────────────────── */
    /* Headings step down in size and colour so a scan reveals structure
       before any of the prose is read. */
    .unit-prose .md-h {
      font-family: var(--font-display);
      line-height: 1.3;
      margin: 1.6em 0 .6em;
      scroll-margin-top: 80px;
    }
    .unit-prose .md-h:first-child { margin-top: 0; }
    .unit-prose .md-h2 {
      font-size: 20px; font-weight: 700; color: var(--text);
      padding-bottom: .3em; border-bottom: 1px solid var(--border);
    }
    .unit-prose .md-h3 {
      font-size: 17px; font-weight: 700; color: var(--cyan);
      letter-spacing: .01em;
    }
    .unit-prose .md-h4 {
      font-size: 15px; font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .06em;
    }

    .unit-prose p { margin: 0 0 1em; }
    .unit-prose p:last-child { margin-bottom: 0; }
    .unit-prose strong { font-weight: 600; color: var(--text); }

    /* ── rendered markdown: lists ───────────────────────────────────── */
    .unit-prose .md-list {
      margin: 0 0 1.1em; padding-left: 1.35em;
      display: flex; flex-direction: column; gap: .45em;
    }
    .unit-prose .md-list li {
      line-height: 1.7; padding-left: .2em;
    }
    .unit-prose ul.md-list { list-style: none; padding-left: 1.1em; }
    .unit-prose ul.md-list li { position: relative; }
    .unit-prose ul.md-list li::before {
      content: "▪";
      position: absolute; left: -1.1em; top: 0;
      color: var(--cyan); font-size: 13px; line-height: 1.7;
    }
    /* "Term: definition" lead-in, so a bullet has internal structure */
    .unit-prose .li-term {
      font-weight: 600;
      color: var(--text);
    }
    .unit-prose .li-term::after {
      content: ":";
      color: var(--text-3);
      font-weight: 400;
    }
    /* A "Term: definition" opener anywhere in the prose, not just in a bullet */
    .unit-prose .lead-in, .unit-blocks .lead-in {
      font-weight: 600; color: var(--text);
      border-bottom: 1px solid var(--border-2, var(--border));
    }
    .unit-prose .lead-in::after, .unit-blocks .lead-in::after {
      content: ":"; color: var(--text-3); font-weight: 400; border: none;
    }
    /* A short unterminated line is a heading the export lost the styling for */
    .unit-prose .md-label {
      display: block; margin: 20px 0 6px;
      font-family: var(--font-body);
      font-weight: 700; font-size: 12.5px; letter-spacing: .04em;
      color: var(--cyan);
    }
    .unit-prose p > .md-label:first-child { margin-top: 0; }
    .unit-prose ol.md-list li::marker {
      color: var(--cyan); font-family: var(--font-mono);
      font-size: 13px; font-weight: 600;
    }

    /* ── rendered markdown: tables ──────────────────────────────────── */
    /* Wrapper scrolls on its own so a wide table never scrolls the page. */
    .md-table-wrap {
      overflow-x: auto;
      margin: 0 0 1.3em;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    .md-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    .md-table th {
      text-align: left;
      font-family: var(--font-display);
      font-size: 12px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--cyan);
      background: var(--card2);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      position: sticky; top: 0;
    }
    .md-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      line-height: 1.6;
      vertical-align: top;
      color: var(--text);
    }
    .md-table tbody tr:last-child td { border-bottom: none; }
    .md-table tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
    :root[data-theme="light"] .md-table tbody tr:nth-child(even) { background: rgba(0,0,0,.02); }
    .md-table tbody tr:hover { background: rgba(58,214,224,.05); }

    /* ── rendered markdown: callouts ────────────────────────────────── */
    /* Tier separation: an exam key reads differently from a passing note. */
    .md-callout {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 16px;
      margin: 0 0 1.2em;
      border-radius: var(--radius);
      border-left: 3px solid var(--border);
      background: var(--card);
      font-size: 15px; line-height: 1.65;
    }
    .md-callout-tag {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 700;
      letter-spacing: .08em;
      padding: 2px 7px; border-radius: 3px;
      margin-top: 2px;
    }
    .md-callout-body { flex: 1; }

    .md-callout-key {
      border-left-color: var(--amber);
      background: var(--amber-bg);
    }
    .md-callout-key .md-callout-tag { background: rgba(245,166,35,.18); color: var(--amber); }

    .md-callout-note {
      border-left-color: var(--cyan);
      background: var(--navy);
    }
    .md-callout-note .md-callout-tag { background: rgba(58,214,224,.15); color: var(--cyan); }

    /* Ethics is built on a compliance-vs-violation contrast; these must read
       as opposites at a glance, not as two identical grey boxes. */
    .md-callout-good {
      border-left-color: var(--green);
      background: var(--green-bg);
    }
    .md-callout-good .md-callout-tag { background: rgba(61,224,138,.18); color: var(--green); }

    .md-callout-bad {
      border-left-color: var(--red);
      background: rgba(224,85,85,.10);
    }
    .md-callout-bad .md-callout-tag { background: rgba(224,85,85,.20); color: var(--red); }

    .md-callout-warn {
      border-left-color: var(--red);
      background: rgba(224,85,85,.08);
    }
    .md-callout-warn .md-callout-tag { background: rgba(224,85,85,.18); color: var(--red); }

    /* ── rendered markdown: quotes / asides ─────────────────────────── */
    /* Supporting detail sits back visually from must-know content. */
    .unit-prose .md-quote {
      margin: 0 0 1.2em;
      padding: 2px 0 2px 16px;
      border-left: 2px solid var(--border);
      color: var(--text-2);
      font-size: 14.5px;
      font-style: italic;
    }

    .unit-prose .inline-code, .md-callout .inline-code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      background: var(--card2); color: var(--cyan);
      padding: 1px 5px; border-radius: 3px;
    }

    /* ── typed content blocks ───────────────────────────────────────── */
    /* Styled to the reading-mode design: serif measure for prose, centred
       formulas, amber-led worked examples, arrowed signal tables. */
    .unit-blocks {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 17px; line-height: 1.62;
      max-width: 64ch;
    }

    .blk-lead {
      font-size: 18.5px; color: var(--text-2);
      border-left: 2px solid var(--cyan);
      padding-left: 18px; margin-bottom: 28px;
    }
    .blk-prose { margin: 0 0 16px; }
    .blk-prose strong, .blk-lead strong,
    .blk-callout-body strong, .blk-worked strong { color: #fff; font-weight: 600; }

    .blk-h2 {
      font-family: var(--font-display);
      font-weight: 600; font-size: 19px; color: var(--cyan);
      margin: 38px 0 12px; letter-spacing: -.01em;
    }
    .blk-h3 {
      font-family: var(--font-body);
      font-weight: 700; font-size: 13px; letter-spacing: .03em;
      color: var(--text-2); text-transform: none;
      margin: 26px 0 8px;
    }

    .blk-list { margin: 0 0 18px; padding-left: 22px; display: block; }
    .blk-list li { margin-bottom: 9px; line-height: 1.55; }
    ul.blk-list { list-style: disc; }
    ul.blk-list li::marker { color: var(--amber); }
    ul.blk-list li::before { content: none; }
    ol.blk-list li::marker { color: var(--cyan); font-family: var(--font-mono); font-size: 14px; }

    /* Formulas read as objects, not sentences. They are wide, so the block
       scrolls rather than letting an expression wrap in the middle — a broken
       expression is worse than a scrollbar. */
    .blk-formula {
      font-family: var(--font-mono); font-size: 14.5px;
      color: var(--cyan); background: var(--card);
      border: 1px solid var(--border); border-left: 2px solid var(--cyan);
      border-radius: 3px; padding: 16px 20px; margin: 22px 0;
      line-height: 1.5; overflow-x: auto;
    }
    .blk-formula-label {
      display: block; font-family: var(--font-body);
      font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 9px;
    }
    .blk-formula-expr {
      display: block; font-size: 15px; letter-spacing: .01em; white-space: nowrap;
    }
    .blk-formula-note {
      display: block; margin-top: 7px; font-family: var(--font-body);
      font-size: 11.5px; color: var(--text-3); white-space: normal;
    }

    /* ── figures ────────────────────────────────────────────────────── */
    /* Generated SVG only. The stylesheet is the one the figures were drawn
       against, remapped from the mockup's token names onto the app's. */
    .blk-figure {
      border: 1px solid var(--border); background: var(--card);
      margin: 22px 0; border-radius: 3px; overflow: hidden;
    }
    .blk-fig-head {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      background: var(--card2); font-family: var(--font-mono);
      font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-3);
    }
    .blk-fig-head b { color: var(--cyan); font-weight: 400; }
    .blk-fig-body { padding: 16px 14px 4px; }
    .blk-fig-cap {
      padding: 12px 14px 14px; font-size: 12.5px;
      color: var(--text-2); line-height: 1.55; font-family: var(--font-body);
    }
    .blk-figure.missing { border-style: dashed; }
    .blk-figure.missing .blk-fig-head b { color: var(--text-3); }

    .blk-fig-body svg { display: block; width: 100%; height: auto; overflow: visible; margin: 0 auto; }
    .blk-fig-body .grid, .blk-fig-body .ax { stroke: var(--text-3); stroke-width: 1; fill: none; }
    .blk-fig-body .grid { stroke: var(--border); }
    .blk-fig-body .lab { font-family: var(--font-mono); font-size: 8.5px; fill: var(--text-3); }
    .blk-fig-body .ttl { font-family: var(--font-display); font-size: 10.5px; font-weight: 600; fill: var(--text-2); }
    .blk-fig-body .nt  { font-family: var(--font-body); font-size: 9.5px; fill: var(--text); }
    .blk-fig-body .nm  { font-family: var(--font-mono); font-size: 8px; fill: var(--text-3); }
    .blk-fig-body .el  { font-family: var(--font-mono); font-size: 7.5px; fill: var(--text-3); }
    .blk-fig-body .pt circle, .blk-fig-body .pt path { fill: var(--cyan); opacity: .72; }
    .blk-fig-body .pt-w circle, .blk-fig-body .pt-w path { fill: var(--amber); opacity: .72; }
    .blk-fig-body .pt-r circle, .blk-fig-body .pt-r path { fill: var(--red); opacity: .72; }
    .blk-fig-body circle.pt { fill: var(--cyan); opacity: .72; }
    .blk-fig-body circle.pt-w { fill: var(--amber); opacity: .72; }
    .blk-fig-body circle.pt-r, .blk-fig-body path.pt-r { fill: var(--red); opacity: .72; }
    .blk-fig-body circle.ptc { fill: var(--text-2); opacity: .6; }
    .blk-fig-body .ok { fill: var(--green); }
    .blk-fig-body .bad { fill: var(--red); }
    .blk-fig-body .wn { fill: var(--amber); }
    .blk-fig-body .node { fill: var(--card2); stroke: var(--border); }
    .blk-fig-body .node-c { fill: rgba(58,214,224,.08); stroke: var(--cyan); }
    .blk-fig-body .node-r { fill: rgba(224,90,90,.08); stroke: var(--red); }
    .blk-fig-body .node-ok { fill: rgba(74,212,138,.07); stroke: var(--green); }
    .blk-fig-body .edge { stroke: var(--text-3); stroke-width: 1; fill: none; }
    .blk-fig-body .edge-y { stroke: var(--green); }
    .blk-fig-body .edge-n { stroke: var(--amber); }
    .blk-fig-body .cellbg { fill: var(--card2); stroke: var(--border); }
    .blk-fig-body .hist { fill: var(--cyan); opacity: .4; }
    .blk-fig-body .bar-t { fill: rgba(58,214,224,.14); stroke: var(--cyan); }
    .blk-fig-body .bar-r { fill: rgba(74,212,138,.12); stroke: var(--green); }
    .blk-fig-body .bar-e { fill: rgba(224,90,90,.12); stroke: var(--red); }
    .blk-fig-body .barc { fill: var(--cyan); opacity: .55; }
    .blk-fig-body .coef-on { fill: var(--cyan); opacity: .75; }
    .blk-fig-body .coef-off { fill: var(--red); opacity: .8; }
    .blk-fig-body .fold-t { fill: var(--card2); stroke: var(--border); }
    .blk-fig-body .fold-v { fill: rgba(58,214,224,.3); stroke: var(--cyan); }
    .blk-fig-body .nn-in { fill: var(--card2); stroke: var(--cyan); }
    .blk-fig-body .nn-hid { fill: var(--card2); stroke: var(--border); }
    .blk-fig-body .nn-out { fill: rgba(58,214,224,.25); stroke: var(--cyan); }
    .blk-fig-body .nn-link { stroke: var(--border); stroke-width: .6; }
    .blk-fig-body .cell-tp, .blk-fig-body .cell-tn { fill: rgba(74,212,138,.10); stroke: var(--green); }
    .blk-fig-body .cell-fp, .blk-fig-body .cell-fn { fill: rgba(224,90,90,.10); stroke: var(--red); }

    .blk-callout {
      display: block; border-radius: 3px; padding: 18px 22px; margin: 24px 0;
      font-size: 16px; line-height: 1.55;
      background: var(--card); border: 1px solid var(--border);
      border-left: 2px solid;
    }
    .blk-callout-tag {
      display: block; font-family: var(--font-body);
      font-size: 9.5px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; margin-bottom: 9px; padding: 0; background: none;
    }
    .blk-callout-body > div { margin: 0 0 12px; }
    .blk-callout-body > div:last-child { margin-bottom: 0; }

    .blk-key  { border-left-color: var(--cyan); background: var(--card); }
    .blk-key  .blk-callout-tag { color: var(--cyan); }
    .blk-trap { border-left-color: #e0623a; background: var(--card); }
    .blk-trap .blk-callout-tag { color: #e0623a; }
    .blk-exam { border-left-color: var(--green); background: var(--card); }
    .blk-exam .blk-callout-tag { color: var(--green); }

    .blk-worked {
      background: var(--card); border: 1px solid var(--border);
      border-top: 2px solid var(--amber); border-left: 1px solid var(--border);
      border-radius: 3px; padding: 22px 24px; margin: 26px 0;
    }
    .blk-worked-title {
      font-family: var(--font-display); font-weight: 600; font-size: 17px;
      color: var(--text); display: block; margin-bottom: 14px;
    }
    .blk-worked-title::before {
      content: "Worked example"; display: block;
      font-family: var(--font-body); font-size: 9.5px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--amber); margin-bottom: 5px;
    }
    .blk-worked-intro, .blk-worked .blk-prose { font-size: 15.5px; }
    /* the vignette as it stands in the reading — quoted, so it is set apart
       from the notes' own framing above it */
    .blk-excerpt {
      margin: 0 0 16px; padding: 14px 18px;
      border-left: 2px solid var(--text-3); background: var(--bg);
      border-radius: 2px;
      font-family: var(--font-body); font-size: 14.5px; font-style: italic;
      color: var(--text-2); line-height: 1.6;
    }
    .blk-excerpt-src {
      display: block; margin-top: 8px; font-style: normal;
      font-size: 9.5px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--text-3);
    }
    .blk-step {
      font-family: var(--font-body); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--text-3);
      margin: 18px 0 8px; display: flex; align-items: center; gap: 9px;
    }
    .blk-step::before {
      content: ""; width: 5px; height: 5px; background: var(--amber);
      border-radius: 50%; flex: none;
    }
    .blk-worked .blk-formula { margin: 10px 0; font-size: 13.5px; padding: 12px 16px; }
    /* the answer is the payoff — it reads as a result, not another paragraph */
    .blk-answer {
      font-family: var(--font-mono); font-size: 14.5px;
      color: var(--bg); background: var(--cyan); font-weight: 600;
      padding: 13px 18px; border-radius: 3px; margin-top: 18px;
      text-align: center; border: none;
    }
    /* visually hidden, not removed — a screen reader still announces "Answer"
       before the value, which is the only thing marking it as the result */
    .blk-answer-label {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    .unit-blocks .md-table-wrap { border: none; background: none; border-radius: 0; }
    .unit-blocks .md-table {
      width: 100%; border-collapse: collapse; margin: 20px 0;
      font-family: var(--font-body); font-size: 13.5px;
    }
    .unit-blocks .md-table th {
      text-align: left; font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--text-3);
      background: none; padding: 0 14px 9px;
      border-bottom: 1px solid var(--border); position: static;
    }
    .unit-blocks .md-table td {
      padding: 11px 14px; border-bottom: 1px solid var(--border);
      vertical-align: top; color: var(--text-2); line-height: 1.45;
    }
    .unit-blocks .md-table tbody tr:nth-child(even) { background: none; }
    .unit-blocks .md-table tbody tr:last-child td { border-bottom: none; }
    /* ContentBlock derives the class from block_type — table_compare becomes
       tbl-compare — while a table nested in a worked example carries whatever
       string its `variant` holds. Both are matched. */
    .unit-blocks .md-table.tbl-compare td:first-child,
    .unit-blocks .md-table.cmp td:first-child { color: var(--text); font-weight: 500; }
    .unit-blocks .md-table tr.total-row td {
      color: var(--cyan); font-weight: 700; border-top: 1px solid var(--border);
    }
    .md-table td.num, .md-table th.num {
      font-family: var(--font-mono); text-align: right; font-size: 13px;
      white-space: nowrap;
    }
    /* signal tables read condition -> consequence */
    .unit-blocks .md-table.tbl-signal td:first-child {
      color: var(--text-3); font-style: italic; width: 46%;
    }
    .unit-blocks .md-table.tbl-signal td:first-child::after {
      content: "\2192"; color: var(--amber); float: right;
      font-style: normal; padding-left: 10px;
    }
    .unit-blocks .md-table.tbl-signal td:last-child { color: var(--text); font-weight: 500; }

    /* ══ report card / targeted review ═══════════════════════════════ */
    /* Ported from codex_report_card_mockup.html onto the ATLAS tokens.
       Everything is rc-prefixed: the mockup's class names (.row, .cell,
       .card, .tag, .box, .step) would collide with the reader's. */

    .rc-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 24px; flex-wrap: wrap;
    }
    .rc-stamp {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text-3); text-align: right; line-height: 1.7;
    }

    /* ── scope switcher, tier one: the path ─────────────────────────── */
    /* Ancestors only, and no boxes. Cyan is a text and rule colour in Codex —
       a solid fill would read as pasted in from another product. */
    .rc-path {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 10.5px;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .rc-crumb {
      background: none; border: none; padding: 2px 0; cursor: pointer;
      color: var(--text-2); font: inherit;
      letter-spacing: inherit; text-transform: inherit;
      border-bottom: 1px solid transparent;
      transition: color .12s, border-color .12s;
    }
    .rc-crumb:hover { color: var(--text); border-bottom-color: var(--text-3); }
    .rc-crumb.here { color: var(--cyan); border-bottom-color: var(--cyan); }
    .rc-crumb:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .rc-sep { color: var(--text-3); font-size: 10px; }

    /* ── scope switcher, tier two: sibling tabs ─────────────────────── */
    /* Scrollbar fully hidden here — the fade at the trailing edge is the
       affordance, so a grey bar never cuts through the layout. */
    .rc-tabs {
      display: flex; margin: 14px 0 6px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
      mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
    }
    .rc-tabs::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .rc-tabs.views { margin: 16px 0 20px; }
    .rc-tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      margin-bottom: -1px; padding: 9px 15px 8px; cursor: pointer;
      white-space: nowrap; text-align: left; color: var(--text-2);
      transition: color .12s, border-color .12s;
    }
    .rc-tab:hover { color: var(--text); }
    .rc-tab.on { color: var(--cyan); border-bottom-color: var(--cyan); }
    /* Negative offset is deliberate: a positive one is clipped by the
       overflow-x on the tab row. */
    .rc-tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
    .rc-tab .t {
      font-family: var(--font-display); font-weight: 600; font-size: 12.5px; display: block;
    }
    .rc-tab .t-short { display: none; }
    .rc-tab .n {
      font-family: var(--font-mono); font-size: 9.5px;
      color: var(--text-3); display: block; margin-top: 2px;
    }
    .rc-tab.on .n { color: var(--text-2); }
    .rc-tab .n.warn { color: var(--red); }

    .rc-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    /* ── headline strip ─────────────────────────────────────────────── */
    /* 1px gaps over a border-coloured backing: cell separators without
       eight separate border declarations. */
    .rc-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1px; background: var(--border); border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .rc-cell { background: var(--card); padding: 14px 16px; }
    .rc-cell-k {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em;
      color: var(--text-3); text-transform: uppercase;
    }
    .rc-cell-v {
      font-family: var(--font-display); font-weight: 700; font-size: 26px;
      letter-spacing: -.02em; margin-top: 5px;
    }
    .rc-cell-n { font-size: 11px; color: var(--text-2); margin-top: 1px; }
    .rc-cell-v.cy { color: var(--cyan); }
    .rc-cell-v.am { color: var(--amber); }
    .rc-cell-v.rd { color: var(--red); }

    .rc-caveat {
      border-left: 2px solid var(--amber); background: var(--amber-bg);
      padding: 10px 14px; font-size: 12.5px; color: var(--amber);
      margin-bottom: 26px;
    }
    /* No conditions row for this round: the slot still shows, because the
       raw score is misleading without it — but it says so rather than
       inventing the wording. */
    .rc-caveat.rc-caveat-empty {
      border-left-color: var(--border); background: var(--card);
      color: var(--text-3);
    }

    /* ── section heads ──────────────────────────────────────────────── */
    .rc-sec {
      font-family: var(--font-display); font-weight: 700; font-size: 12px;
      letter-spacing: .1em; text-transform: uppercase; color: var(--text-2);
      margin: 0 0 4px;
    }
    .rc-secnote {
      font-size: 12.5px; color: var(--text-3); margin-bottom: 14px; max-width: 640px;
    }

    /* ── concept ladder, grouped by reading ─────────────────────────── */
    /* Grouped the way the material is packaged: a reading you open lines up
       with the concepts you owe it. */
    .rc-grp { border: 1px solid var(--border); margin-bottom: 10px; background: var(--card); }
    .rc-grp.dim { opacity: .6; }
    .rc-ghead {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 9px 14px; background: var(--card2); border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .rc-gtitle { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
    .rc-gtitle b {
      color: var(--text-3); font-family: var(--font-mono);
      font-size: 10px; font-weight: 400; margin-right: 7px;
    }
    .rc-gmeta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
    .rc-gmeta em { font-style: normal; color: var(--text-2); }
    .rc-gnote { padding: 12px 14px; font-size: 12.5px; color: var(--text-3); }

    .rc-row {
      display: grid; grid-template-columns: 1fr 108px 78px 76px 22px;
      align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .rc-grp > .rc-row:last-child { border-bottom: none; }
    .rc-row:hover { background: var(--card2); }
    .rc-row:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
    .rc-lbl { font-weight: 500; font-size: 13.5px; min-width: 0; }
    .rc-lbl small {
      display: block; color: var(--text-3); font-size: 10.5px;
      font-weight: 400; margin-top: 1px; font-family: var(--font-mono);
    }
    .rc-chev {
      color: var(--text-3); font-size: 11px; text-align: center;
      transition: transform .15s;
    }
    .rc-row.open .rc-chev { transform: rotate(90deg); color: var(--cyan); }
    .rc-tagwrap { display: flex; flex-direction: column; gap: 3px; }

    /* ── row expansion: the fix, then the evidence ──────────────────── */
    .rc-det {
      padding: 0 14px 14px; border-bottom: 1px solid var(--border);
      background: var(--card2);
    }
    .rc-fix {
      border-left: 2px solid var(--cyan); padding: 9px 12px; margin-bottom: 11px;
      font-size: 13px; color: var(--text); background: rgba(58,214,224,.05);
    }
    .rc-fix b {
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em;
      color: var(--cyan); display: block; margin-bottom: 4px; text-transform: uppercase;
    }
    .rc-ev { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    /* Position and error class only. A chip never carries question text. */
    .rc-q {
      font-family: var(--font-mono); font-size: 10.5px; padding: 4px 8px;
      border: 1px solid var(--border); background: var(--card);
    }
    .rc-q.miss { border-color: rgba(224,85,85,.35); color: #e89a9a; }
    .rc-q.hit { border-color: rgba(61,224,138,.3); color: #8fd9b2; }
    .rc-q em { font-style: normal; color: var(--text-3); margin-left: 5px; }
    .rc-evnote { font-size: 11.5px; color: var(--text-3); }

    /* Attempt pips: one per lifetime attempt, in order. Filled is a hit,
       hollow is a miss. The count is the information — 0 of 4 has to read
       as worse than 0 of 2 when both say 0%. */
    .rc-pips { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .rc-pip {
      width: 11px; height: 11px; border-radius: 50%;
      border: 1.5px solid var(--red); flex: none;
    }
    .rc-pip.hit { background: var(--green); border-color: var(--green); }
    .rc-pip-more {
      font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
    }

    .rc-rate {
      font-family: var(--font-mono); font-size: 14px; font-weight: 500;
      text-align: right;
    }
    .rc-rate.z { color: var(--red); }
    .rc-rate.mid { color: var(--amber); }
    .rc-rate.ok { color: var(--green); }
    .rc-rate small {
      display: block; font-size: 10px; color: var(--text-3); font-weight: 400;
    }

    .rc-tag {
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em;
      padding: 3px 7px; border: 1px solid; text-align: center;
    }
    .rc-tag.re { color: var(--red);   border-color: rgba(224,85,85,.4);  background: rgba(224,85,85,.07); }
    .rc-tag.ck { color: var(--amber); border-color: rgba(245,166,35,.4); background: rgba(245,166,35,.07); }
    .rc-tag.mt { color: var(--text-3); border-color: var(--border); }
    /* A concept that graduated and came back is not the same as one that
       never left, even when the tag it returns with is softer. */
    .rc-tag.rt { color: var(--cyan); border-color: rgba(58,214,224,.35); background: rgba(58,214,224,.06); }

    /* ── module bars ────────────────────────────────────────────────── */
    .rc-mods { display: grid; margin-top: 8px; }
    .rc-mod {
      display: grid; grid-template-columns: 1fr 120px 170px 96px;
      align-items: center; gap: 13px; font-size: 13px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .rc-mod:last-child { border-bottom: none; }
    /* 50% on one attempt is a different claim from 50% on three. Without this
       the bars imply a stable measurement that does not exist yet. */
    .rc-attempts { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
    .rc-attempts b { color: var(--text-2); font-weight: 400; }
    .rc-bar {
      height: 7px; background: var(--card2);
      border: 1px solid var(--border); position: relative;
    }
    .rc-fill { position: absolute; inset: 0 auto 0 0; background: var(--cyan); opacity: .75; }
    /* the 70% working threshold */
    .rc-mps { position: absolute; top: -3px; bottom: -3px; left: 70%; width: 1px; background: var(--amber); }
    .rc-pct {
      font-family: var(--font-mono); font-size: 12px;
      text-align: right; color: var(--text-2);
    }

    /* ── review cards ───────────────────────────────────────────────── */
    .rc-qhead {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .rc-card { border: 1px solid var(--border); background: var(--card); margin-bottom: 12px; }
    .rc-card-meta {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--card2);
      font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
      letter-spacing: .05em; flex-wrap: wrap;
    }
    .rc-card-body { padding: 15px 16px; }
    .rc-front { font-size: 14.5px; font-weight: 500; margin-bottom: 9px; }
    .rc-back {
      font-size: 13px; color: var(--text-2);
      border-left: 2px solid var(--cyan); padding-left: 12px;
    }
    .rc-card.prime { border-color: rgba(245,166,35,.35); }
    .rc-card.prime .rc-back { border-left-color: var(--amber); }
    .rc-acts { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
    .rc-btn {
      font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .05em;
      padding: 6px 13px; background: none; border: 1px solid var(--border);
      color: var(--text-2); transition: color .15s, border-color .15s;
    }
    .rc-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .rc-btn:disabled { opacity: .4; cursor: not-allowed; }

    .rc-rule { height: 1px; background: var(--border); margin: 22px 0 16px; }

    .rc-empty {
      border: 1px solid var(--border); background: var(--card);
      padding: 20px; font-size: 13px; color: var(--text-2);
    }
    .rc-empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .rc-empty code {
      font-family: var(--font-mono); font-size: 12px; color: var(--cyan);
    }

    /* ── loop ───────────────────────────────────────────────────────── */
    .rc-steps {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1px; background: var(--border); border: 1px solid var(--border);
      margin-bottom: 22px;
    }
    .rc-step { background: var(--card); padding: 15px 16px; }
    .rc-step-n { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
    .rc-step h5 { font-family: var(--font-display); font-size: 14px; margin: 5px 0; }
    .rc-step p { font-size: 12px; color: var(--text-3); line-height: 1.45; }
    .rc-step.live { background: var(--card2); box-shadow: inset 2px 0 0 var(--cyan); }
    .rc-step.live h5 { color: var(--cyan); }
    .rc-gate { border: 1px solid var(--border); background: var(--card); padding: 16px; }
    .rc-gate h4 {
      font-family: var(--font-display); font-size: 12px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--cyan); margin-bottom: 9px;
    }
    .rc-gate p { font-size: 13px; color: var(--text-2); margin-bottom: 9px; max-width: 660px; }
    .rc-gate p:last-child { margin-bottom: 0; }
    .rc-gate code { font-family: var(--font-mono); color: var(--amber); font-size: 12.5px; }

    /* ── priming strip (inside a practice unit) ─────────────────────── */
    .rc-prime-strip { margin-bottom: 20px; }
    .rc-prime-head {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--amber); margin-bottom: 8px;
    }

    /* ── global scrollbars ──────────────────────────────────────────── */
    /* Blended, not hidden: on a long report card these are the only cue that
       it continues below the fold. The 2px --bg border on the thumb is what
       makes it read as a hairline rather than a widget. */
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border); border: 2px solid var(--bg); }
    *::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
    *::-webkit-scrollbar-corner { background: transparent; }

    /* ── responsive ─────────────────────────────────────────────────── */
    /* Dropping the score line lets five tabs fit 380px without scrolling;
       the fade mask covers topic scope, where there may be ten. */
    @media (max-width: 600px) {
      .rc-tab { padding: 8px 11px; }
      .rc-tab .n { display: none; }
      .rc-tab .t { display: none; }
      .rc-tab .t-short {
        display: block; font-family: var(--font-display);
        font-weight: 600; font-size: 12.5px;
      }
    }
    /* The row keeps label, rate and chevron. Pips move into the expansion,
       where the chips carry the same evidence in full. */
    @media (max-width: 760px) {
      .rc-row { grid-template-columns: 1fr 78px 22px; gap: 10px; }
      .rc-pips, .rc-tagwrap { display: none; }
      .rc-mod { grid-template-columns: 1fr 96px; }
      .rc-bar, .rc-attempts { display: none; }
    }

    /* A fifth nav item takes the topbar past a 380px viewport, which would
       scroll the whole page sideways. The nav wraps to its own line and scrolls
       within itself instead. */
    @media (max-width: 640px) {
      .topbar { flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
      .topbar-nav { width: 100%; overflow-x: auto; scrollbar-width: none; }
      .topbar-nav::-webkit-scrollbar { display: none; }
      .nav-btn { flex: none; }
      .main { padding: 24px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important; animation-iteration-count: 1 !important;
        transition-duration: .001ms !important; scroll-behavior: auto !important;
      }
    }

    /* ── reading card meta ──────────────────────────────────────────── */
    .reading-meta-item { white-space: nowrap; }
    .reading-meta-item + .reading-meta-item::before {
      content: "·";
      margin-right: 10px;
      color: var(--text-3);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
